{% extends "layout.html" %}


{% block title %}
Register
{% endblock %}




{% block body  %}
<form class=" box container mt-7 content-section p-4 rounded shadow " method = "post" action ="/register">
    <ul style ="list-style : none;" >
        <li >
            <h1 class ="text-center mb-4" style ="color : #7a2623;" > Create your account Now !</h1>
        </li>

        <li class ="form-floating mb-3">
            <input class ="form-control " style = "background-color : #d1534e;"  type="email" name ="email" placeholder ="name@example.com"  autocomplete ="off" >
            <label style ="color :#7a2623 ;" for="email">name@example.com</label>
        </li>
        <li class ="form-floating mb-3">
            <input class ="form-control" style = "background-color : #d1534e;" type ="password" placeholder ="Password" name ="password" autocomplete ="off">
            <label for="password" style ="color :#7a2623 ;" > Password </label>
        </li>
        <li class ="form-floating mb-3">
            <input class ="form-control" style = "background-color : #d1534e;" type ="password" placeholder ="Confirm password" name ="confirm_password" autocomplete ="off">
            <label for="confirm_password" style ="color :#7a2623 ;" > Password </label>
        </li>
    </ul>
    <button class ="btn btn-danger w-100" type ="submit" style ="background-color : #8f2d29 ;"> Register </button>
</form>
{% endblock %}
