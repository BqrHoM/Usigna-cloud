<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Purchase Successful!</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #b83a34 ;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .checkmark-container {
      text-align: center;
      animation: fadeIn 0.8s ease-in-out;
    }

    .checkmark {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: inline-block;
      position: relative;
      background: #28a745;
      animation: pop 0.4s ease-out forwards;
    }

    .checkmark::after {
      content: "";
      position: absolute;
      left: 30px;
      top: 30px;
      width: 25px;
      height: 50px;
      border-right: 5px solid white;
      border-bottom: 5px solid white;
      transform: rotate(45deg) scale(0);
      animation: drawCheck 1s 0.4s ease forwards;
    }

    @keyframes pop {
      0% { transform: scale(0); }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes drawCheck {
      0% { transform: rotate(45deg) scale(0); }
      100% { transform: rotate(45deg) scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="checkmark-container">
    <div class="checkmark"></div>
    <h1 class="mt-4 text-success fw-bold">{{a}}</h1>
    <p class="text-secondary">Thank you for chosing usigna !.</p>
    <a href="/" class="btn btn-outline-success mt-3">Return Home</a>
  </div>
</body>
</html>
